{% extends "base.html" %}

{% block content %}
<h2>Введите код подтверждения</h2>
{% if error %}
  <p style="color: red;">{{ error }}</p>
{% endif %}
<form method="post">
  {% csrf_token %}
  <label>Код:</label>
  <input type="text" name="code" required><br>

  <button type="submit">Подтвердить</button>
</form>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<h2>Регистрация</h2>
<form method="post">
  {% csrf_token %}
  <label>Имя пользователя:</label>
  <input type="text" name="username" required><br>

  <label>Email:</label>
  <input type="email" name="email" required><br>

  <label>Пароль:</label>
  <input type="password" name="password" required><br>

  <button type="submit">Отправить код</button>
</form>
{% endblock %}
